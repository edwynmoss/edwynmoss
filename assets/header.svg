<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Edwyn Moss — security-first engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B1F"/>
      <stop offset="1" stop-color="#0E2A30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B860"/>
      <stop offset="1" stop-color="#E7DCCB"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3CB4B8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3CB4B8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3CB4B8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6F78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F6F78" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1F6F78" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="250" rx="18"/></clipPath>
    <style>
      .name { font: 800 62px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .sub  { font: 500 19px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #E7DCCB; }
      .mono { font: 500 13px Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; fill: #3CB4B8; letter-spacing: 1.5px; }
      .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: translateY(0);} }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 730px 125px; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.94);} 50% { opacity: .9; transform: scale(1);} }
      .ping { transform-origin: 730px 125px; animation: ping 2.4s cubic-bezier(0,.6,.4,1) infinite; }
      @keyframes ping { 0% { opacity: .8; transform: scale(.2);} 100% { opacity: 0; transform: scale(1.15);} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="250" fill="url(#bg)"/>
    <rect width="900" height="250" fill="url(#grid)"/>
    <circle cx="730" cy="125" r="170" fill="url(#glow)"/>

    <!-- scanning sweep -->
    <rect x="-300" y="0" width="300" height="250" fill="url(#sweep)">
      <animate attributeName="x" values="-300;900" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- radar -->
    <g fill="none" stroke="#3CB4B8" stroke-opacity="0.55">
      <circle cx="730" cy="125" r="34"/>
      <circle cx="730" cy="125" r="62" stroke-opacity="0.35"/>
      <circle cx="730" cy="125" r="90" stroke-opacity="0.22"/>
      <path d="M640 125H820M730 35V215" stroke-opacity="0.18"/>
    </g>
    <circle class="ping" cx="730" cy="125" r="90" fill="none" stroke="#F4B860" stroke-width="1.5"/>
    <g class="pulse"><circle cx="730" cy="125" r="6" fill="#F4B860"/></g>
    <path d="M730 125 L730 35 A90 90 0 0 1 808 80 Z" fill="#3CB4B8" fill-opacity="0.28">
      <animateTransform attributeName="transform" type="rotate" from="0 730 125" to="360 730 125" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- blips -->
    <circle cx="772" cy="92" r="3" fill="#F4B860"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="160" r="3" fill="#F4B860"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="176" r="2.5" fill="#E7DCCB"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.1s" repeatCount="indefinite"/></circle>

    <!-- copy -->
    <text class="mono rise d1" x="56" y="78">&gt; SECURITY-FIRST ENGINEER  //  CAPE TOWN  //  UTC+2</text>
    <text class="name rise d2" x="52" y="146" fill="url(#gold)">Edwyn Moss</text>
    <text class="sub rise d3" x="56" y="182">Resilient platforms. Sharp panels. Calm interfaces.</text>

    <!-- accent bar -->
    <rect x="56" y="200" height="3" rx="1.5" fill="#F4B860">
      <animate attributeName="width" values="0;180" dur="1.2s" begin="0.9s" fill="freeze"/>
    </rect>
    <rect x="0" y="246" width="900" height="4" fill="#1F6F78"/>
  </g>
</svg>

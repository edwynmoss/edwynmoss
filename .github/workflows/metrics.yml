name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: a classic PAT with repo + read:org + read:user so private work is counted.
          # Falls back to GITHUB_TOKEN (public data only) when the secret is not set.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          filename: github-metrics.svg
          user: edwynmoss
          template: classic
          config_timezone: Africa/Johannesburg
          config_display: large
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile
          plugin_languages_colors: github
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_from: 500
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_lines: yes
          plugin_lines_sections: base
